<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PopAgent">
	<!-- K6：石墨黑底 + 白色 P + 亮蓝六边形（2026-11-23 用户选定）。
	     P = 产品名首字母（Pop），六边形 = 一群 agent 里被控制的那一个（蜂巢语义）。
	     深底给白 P 最强的对比；亮蓝 hex 是唯一高饱和色，做视觉落点，16px 也不糊。
	     改图之后**必须换 URL**（index.html / manifest / 组件里的 `?v=`）。 -->
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#1F2937" />
			<stop offset=".55" stop-color="#111827" />
			<stop offset="1" stop-color="#0B1220" />
		</linearGradient>
	</defs>
	<rect width="32" height="32" rx="7" fill="url(#tile)" />
	<g fill="#F8FAFC">
		<rect x="7.6" y="9" width="3.2" height="14" rx="1.6" />
		<path d="M10.8 9h4.4a4.4 4.4 0 0 1 0 8.8h-4.4v-2.8h4.2a1.6 1.6 0 0 0 0-3.2h-4.2z" />
	</g>
	<polygon
		points="26.81,18.4 26.81,22.8 23,25 19.19,22.8 19.19,18.4 23,16.2"
		fill="none"
		stroke="#60A5FA"
		stroke-width="1.8"
		stroke-linejoin="round"
	/>
</svg>
